<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulário</title>
    <link rel="stylesheet" href="formulário.css">
</head>
<body>
    <script src="script.js"></script>

    <div class="formulário">
    <header>
        <h1>Recife verde</h1>
        <p>CADASTRO DE ÁRVORES</p>
    </header>
    <form>
     <label for="especie">Espécie de árvore:</label>
     <input
     type="text"
     id="especie"
     name="especie"
     placeholder="Ex:Cerejeira"> 
     <div class="bairro">
        <label for="bairro">Bairro:</label>
        <input
        type="text"
        id="bairro"
        name="bairro"
        placeholder="Ex: Boa viagem">
     </div> 
     <div class="rua">
        <label for="rua">Rua:</label>
        <input
        type="text"
        id="rua"
        name="rua"
        placeholder="Ex:Rua dos alfinetes ">
     </div>
     <div>
        <label for="estado">Estado:</label>
        <input
        type="text"
        id="estado"
        name="estado"
        placeholder="Ex:saudável">
     </div>
     <div>
        <label for="data">Data de plantio:</label>
        <input
        type="date"
        id="data"
        name="data"
        placeholder="10/03/2026">
     </div>
     <div>
        <input
        type="button"
        id="enviar"
        value="enviar"
        >
     </div>
      </form>
    </div>
    
</body>
</html>
